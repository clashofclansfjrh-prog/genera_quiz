<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Generador de Pruebas Interactivas</title>
  <!-- Librerías de Extracción -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
  <style>
    body { font-family: sans-serif; background-color: #f8fafc; padding: 40px; display: flex; justify-content: center; }
    .container { max-width: 650px; width: 100%; background: white; padding: 24px; border-radius: 12px; border: 1px solid #e2e8f0; }
    .dropzone { border: 2px dashed #cbd5e1; padding: 30px; text-align: center; cursor: pointer; border-radius: 8px; }
    button { background: #2563eb; color: white; border: none; padding: 12px; border-radius: 6px; width: 100%; margin-top: 12px; cursor: pointer; font-weight: bold; }
    button:disabled { background: #cbd5e1; cursor: not-allowed; }
    .question-box { margin-top: 20px; border-bottom: 1px solid #e2e8f0; padding-bottom: 15px; }
    .option-btn { background: #f1f5f9; color: #1e293b; text-align: left; margin-top: 6px; width: 100%; }
    .option-btn.correct { background: #dcfce7; color: #166534; }
    .option-btn.incorrect { background: #fee2e2; color: #991b1b; }
    .hidden { display: none; }
  </style>
</head>
<body>

  <div class="container">
    <h2>Generador de Cuestionarios (PDF / Word)</h2>
    
    <div class="dropzone" onclick="document.getElementById('fileInput').click()">
      <p id="fileLabel">📄 Haz clic para subir un archivo .pdf o .docx</p>
      <input type="file" id="fileInput" accept=".pdf, .docx" style="display:none;" onchange="handleFileSelect(event)">
    </div>

    <button id="generateBtn" onclick="generarQuiz()" disabled>Generar Quiz con IA</button>
    <p id="status" style="font-size: 14px; color: #64748b;"></p>

    <div id="quizContainer" class="hidden">
      <h3>Prueba Generada:</h3>
      <div id="questionsWrapper"></div>
    </div>
  </div>

  <script>
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    let textoExtraido = "";

    function handleFileSelect(e) {
      const file = e.target.files[0];
      if (!file) return;

      document.getElementById('fileLabel').textContent = `Archivo: ${file.name}`;
      document.getElementById('status').textContent = 'Extrayendo texto...';
      
      const ext = file.name.split('.').pop().toLowerCase();
      if (ext === 'docx') extraerWord(file);
      else if (ext === 'pdf') extraerPDF(file);
    }

    function extraerWord(file) {
      const reader = new FileReader();
      reader.onload = (e) => {
        mammoth.extractRawText({ arrayBuffer: e.target.result })
          .then(res => { textoExtraido = res.value; listo(); });
      };
      reader.readAsArrayBuffer(file);
    }

    async function extraerPDF(file) {
      const buffer = await file.arrayBuffer();
      const pdf = await pdfjsLib.getDocument({ data: buffer }).promise;
      let text = '';
      for (let i = 1; i <= pdf.numPages; i++) {
        const page = await pdf.getPage(i);
        const content = await page.getTextContent();
        text += content.items.map(item => item.str).join(' ') + '\n';
      }
      textoExtraido = text;
      listo();
    }

    function listo() {
      document.getElementById('status').textContent = '¡Texto listo! Presiona "Generar Quiz".';
      document.getElementById('generateBtn').disabled = false;
    }

    async function generarQuiz() {
      document.getElementById('status').textContent = 'Consultando a la API de forma segura...';
      document.getElementById('generateBtn').disabled = true;

      const res = await fetch('/api/generar-quiz', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ textoDocumento: textoExtraido })
      });

      const data = await res.json();
      if (res.ok && data.quiz) {
        document.getElementById('status').textContent = '¡Quiz listo!';
        renderizar(data.quiz);
      } else {
        document.getElementById('status').textContent = 'Error: ' + (data.error || 'Fallo inesperado');
      }
    }

    function renderizar(preguntas) {
      const wrapper = document.getElementById('questionsWrapper');
      wrapper.innerHTML = '';
      preguntas.forEach((q, i) => {
        const div = document.createElement('div');
        div.className = 'question-box';
        div.innerHTML = `<strong>${i + 1}. ${q.pregunta}</strong>`;

        q.opciones.forEach((opt, optIdx) => {
          const btn = document.createElement('button');
          btn.className = 'option-btn';
          btn.textContent = opt;
          btn.onclick = () => {
            const btns = div.querySelectorAll('.option-btn');
            btns.forEach(b => b.disabled = true);
            if (optIdx === q.respuestaCorrecta) btn.classList.add('correct');
            else {
              btn.classList.add('incorrect');
              btns[q.respuestaCorrecta].classList.add('correct');
            }
          };
          div.appendChild(btn);
        });
        wrapper.appendChild(div);
      });
      document.getElementById('quizContainer').classList.remove('hidden');
    }
  </script>
</body>
</html>
